name: Weather Proxy

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update-weather:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch WeatherAPI
        run: |
          curl "https://api.weatherapi.com/v1/current.json?key=49b2f6117897475e850194206263108&q=London&aqi=no" -o weather.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git commit -m "Update weather" || echo "No changes"
          git push
