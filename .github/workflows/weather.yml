name: Weather Proxy

on:
  schedule:
    - cron: "*/10 * * * *"   # updates every 10 minutes
  workflow_dispatch:

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch WeatherAPI
        run: |
          curl "https://api.weatherapi.com/v1/current.json?key=49b2f6117897475e850194206263108&q=Hendon&aqi=no" -o weather.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add weather.json
          git commit -m "Update weather" || echo "No changes"
          git push
